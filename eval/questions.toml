# Questions for `kvasir eval`. Each names the output its wording should lead the
# brief to choose, and checks a judge answers yes or no against the finished report. Checks ask
# what a reader of the question needs, not for facts the run could only get from memory.

[[question]]
id = "jwst-cooling"
question = "How does the James Webb Space Telescope keep its infrared instruments cold enough to work?"
output = "report"
checks = [
  "Explains the role of the sunshield.",
  "Mentions the cryocooler used for the mid-infrared instrument (MIRI).",
  "Gives at least one operating temperature in kelvin or degrees.",
]

[[question]]
id = "blackout-2003"
question = "What caused the 2003 Northeast blackout in North America?"
output = "report"
checks = [
  "Names FirstEnergy, or the Ohio utility where the failure began.",
  "Mentions the failure of an alarm or monitoring software.",
  "Mentions transmission lines sagging into trees.",
  "States roughly how many people lost power.",
]

[[question]]
id = "antikythera"
question = "Why did the Antikythera mechanism take so long to understand?"
output = "report"
checks = [
  "Mentions that the device was corroded or broken into fragments.",
  "Mentions X-ray or CT imaging as a turning point.",
  "Describes what the mechanism computed, such as astronomical positions or eclipses.",
]

[[question]]
id = "four-day-week"
question = "What do trial results say for and against a four-day work week?"
output = "report"
checks = [
  "Names at least one specific trial, with its country or year.",
  "Reports a finding about productivity or revenue.",
  "Reports a finding about wellbeing or burnout.",
  "Gives at least one argument or finding against it.",
]

[[question]]
id = "cold-heat-pumps"
question = "How well do air-source heat pumps work in very cold climates?"
output = "report"
checks = [
  "Explains that efficiency (COP) falls as the outdoor temperature drops.",
  "Gives a COP or efficiency figure at a stated cold temperature.",
  "Mentions backup heating or models designed for cold climates.",
]

[[question]]
id = "fasting"
question = "Is intermittent fasting better for weight loss than daily calorie restriction?"
output = "report"
checks = [
  "Refers to randomised controlled trials or meta-analyses.",
  "States whether the weight loss of the two approaches differs.",
  "Mentions a limitation of the evidence, such as trial length or size.",
]

[[question]]
id = "rosetta-stone"
question = "How did the Rosetta Stone help decipher Egyptian hieroglyphs?"
output = "report"
checks = [
  "Mentions that it carries the same text in three scripts.",
  "Names Jean-François Champollion.",
  "Mentions cartouches or royal names as a key to the decipherment.",
]

[[question]]
id = "honeybees"
question = "What are the main causes of honeybee colony losses?"
output = "report"
checks = [
  "Mentions Varroa mites or the viruses they carry.",
  "Mentions pesticides, such as neonicotinoids.",
  "Mentions loss of forage or habitat, or poor nutrition.",
  "Gives a loss rate or a number of colonies lost.",
]

[[question]]
id = "rust-borrow-checker"
question = "How does Rust's borrow checker prevent data races?"
output = "report"
checks = [
  "Explains ownership.",
  "States the rule of one mutable reference or any number of shared references.",
  "Mentions the Send or Sync traits.",
  "States that the checks happen at compile time.",
]

[[question]]
id = "aral-sea"
question = "What happened to the Aral Sea, and why?"
output = "report"
checks = [
  "Names the diversion of the Amu Darya and Syr Darya rivers for irrigation.",
  "Quantifies how much the sea shrank.",
  "Mentions the Kok-Aral dam or the partial recovery of the North Aral Sea.",
  "Mentions an effect on health, fishing or the local economy.",
]

[[question]]
id = "wasm-adoption"
question = "How widely is WebAssembly adopted, in the browser and outside it?"
output = "report"
checks = [
  "Separates use in the browser from use outside it, such as on servers or at the edge.",
  "Gives at least one adoption figure and says who measured it.",
  "Names at least one production use by a named company or product.",
]

[[question]]
