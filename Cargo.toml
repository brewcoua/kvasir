[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# The release, which release-please keeps current here and in Cargo.lock.
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
kvasir-api = { path = "crates/kvasir-api" }
kvasir-browser = { path = "crates/kvasir-browser" }
kvasir-config = { path = "crates/kvasir-config" }
kvasir-db = { path = "crates/kvasir-db" }
kvasir-extract = { path = "crates/kvasir-extract" }
kvasir-fetch = { path = "crates/kvasir-fetch" }
kvasir-graph = { path = "crates/kvasir-graph" }
kvasir-ledger = { path = "crates/kvasir-ledger" }
kvasir-llm = { path = "crates/kvasir-llm" }
kvasir-research = { path = "crates/kvasir-research" }
kvasir-run = { path = "crates/kvasir-run" }
kvasir-sites = { path = "crates/kvasir-sites" }
kvasir-storm = { path = "crates/kvasir-storm" }
kvasir-testkit = { path = "crates/kvasir-testkit" }
kvasir-types = { path = "crates/kvasir-types" }

anyhow = "1"
arc-swap = "1.9"
axum = "0.8"
backon = "1.6"
base64 = "0.22"
chromiumoxide = "0.9.1"
dom_query = "0.24"
dsrust-json-repair = { version = "=0.1.0-alpha.3", features = ["serde"] }
encoding_rs = "0.8"
fancy-regex = "0.20"
futures = "0.3"
http-body-util = "0.1"
httpdate = "1"
idna = "1.1"
indexmap = { version = "2", features = ["serde"] }
pbkdf2 = "0.12"
pdf_oxide = "0.3.78"
psl = "2"
quick-xml = { version = "0.42", features = ["serialize"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["brotli", "deflate", "gzip", "json", "rustls"] }
rlimit = "0.11"
rs-trafilatura = "0.2.2"
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl", "functions"] }
rust-embed = { version = "8", features = ["mime-guess"] }
schemars = { version = "1.2", features = ["indexmap2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "1"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.29"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6"
zip = { version = "9", default-features = false, features = ["deflate"] }

# Enough for a backtrace's file and line, at under half the size of target/debug. A debugger shows no
# local variables: use `debug = true` locally for a session that needs them.
[profile.dev]
debug = "line-tables-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
