[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
kvasir-config = { path = "crates/kvasir-config" }
kvasir-db = { path = "crates/kvasir-db" }
kvasir-llm = { path = "crates/kvasir-llm" }
kvasir-types = { path = "crates/kvasir-types" }

anyhow = "1"
arc-swap = "1.9"
dsrust-json-repair = { version = "=0.1.0-alpha.3", features = ["serde"] }
idna = "1.1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
