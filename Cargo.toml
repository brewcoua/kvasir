[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
kvasir-config = { path = "crates/kvasir-config" }
kvasir-db = { path = "crates/kvasir-db" }
kvasir-extract = { path = "crates/kvasir-extract" }
kvasir-llm = { path = "crates/kvasir-llm" }
kvasir-testkit = { path = "crates/kvasir-testkit" }
kvasir-types = { path = "crates/kvasir-types" }

anyhow = "1"
arc-swap = "1.9"
backon = "1.6"
dom_query = "0.24"
dsrust-json-repair = { version = "=0.1.0-alpha.3", features = ["serde"] }
idna = "1.1"
pdf_oxide = "0.3.78"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rlimit = "0.11"
rs-trafilatura = "0.2.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
toml = "1"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
url = "2.5"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
