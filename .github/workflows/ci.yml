name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.32"
          enable-cache: true

      # --locked fails rather than re-resolving, so a lockfile that drifted from pyproject.toml is
      # caught here instead of producing an image built from different versions than were tested.
      - run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

      # Integration tests need a gateway and a SearXNG, and are deselected by the marker
      # expression in pyproject.toml.
      - run: uv run pytest

  image:
    # Proves the Dockerfile still builds without publishing anything. amd64 only, since this is a
    # build check rather than a release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
