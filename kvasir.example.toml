# Copy to kvasir.toml, which is read from the working directory when KVASIR_CONFIG is unset.
# The tables mirror the settings, and each key's variable is KVASIR_<TABLE>_<KEY>, such as
# KVASIR_MODEL_FAST. A variable that is set wins over the file.
# These values run against a local Ollama and the SearXNG from the README's quickstart.

data_dir = "data"
# Ollama answers one request at a time by default, so a wide pool only queues. Start it with
# OLLAMA_NUM_PARALLEL=2 for intake calls to run side by side.
max_threads = 2

# Models are written <provider>/<name>, the provider being one of these tables.
[provider.local]
api_base = "http://localhost:11434/v1"
# No api_key: Ollama ignores it. A signed-in local Ollama also serves `:cloud` models without one.

# A second provider. Give its key as KVASIR_PROVIDER_CLOUD_API_KEY rather than writing it here.
# [provider.cloud]
# api_base = "https://ollama.com/v1"
# api_key = "..."

[model]
fast = "local/gpt-oss:20b"
strong = "local/deepseek-v4.1-flash:cloud"
embedding = "local/nomic-embed-text:latest"
# The model for judgements, such as whether a source supports a sentence. Leave out to use strong.
reason = "local/gpt-oss:120b-cloud"
# A grounding checker, after `ollama pull bespoke-minicheck`. Leave out to check with the fast model.
# checker = "local/bespoke-minicheck"
# Thinking tokens count against each role's token budget, which leaves no room for the answer.
reasoning_effort = "none"
# The reason model is the exception: it is meant to think. reason_effort defaults to "medium".
# The models' num_ctx. Sizes how much of a page one intake call reads, and how long a section may run.
context_tokens = 16384

[search]
url = "http://localhost:8888"

[runs]
# Keeps runs across restarts in data/kvasir.db, for debugging. The default is memory.
store = "sqlite"

[fetch]
# Named in the user agent of page requests, so a site can reach you. Leave out to name no one.
contact = "you@example.com"
# Least time between the starts of two requests to one host.
host_interval_seconds = 1.0
# "auto" renders a page that needs JavaScript in Chromium (needs the browser extra); "off" never.
render = "auto"
# Renders through Patchright, which hides the signs of automation. Getting past a challenge can
# break a site's terms, which is your call.
stealth = false
# Hours a cached page is served without asking its site; then it is revalidated. 0 fetches again.
max_age_hours = 48

[log]
format = "text"
