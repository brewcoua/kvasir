[project]
name = "kvasir"
version = "0.1.0"
description = "A self-hostable HTTP service for Stanford STORM and Co-STORM, with an Open WebUI client"
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "MIT OR Apache-2.0" }
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "knowledge-storm==1.1.1",
    "pydantic==2.13.4",
    # Not imported here. Declared only so [tool.uv.sources] can redirect it, which uv applies to
    # direct dependencies alone. See the comment on the torch source below.
    "torch==2.13.0",
    "uvicorn==0.52.3",
]

[project.urls]
Homepage = "https://github.com/brewcoua/kvasir"

[tool.uv]
# knowledge-storm leaves sentence-transformers unpinned, and the resolver picks 2.2.2, which
# imports huggingface_hub.cached_download. That was removed in huggingface-hub 0.26, so
# `import knowledge_storm` raises ImportError. 5.7.0 is the oldest version that resolves against
# the rest of the tree. Nothing here uses sentence-transformers; it is a transitive weight.
constraint-dependencies = ["sentence-transformers==5.7.0"]

[tool.uv.sources]
# The default torch wheels bundle the CUDA runtime, several GB the service can never use: no model
# runs locally, embeddings go to the gateway. The CPU index carries the same versions without it.
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kvasir"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
# knowledge_storm ships no type information, so its classes are Any and strict mode refuses to
# subclass them. Extending its callback handlers is the supported way to observe a run.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# knowledge_storm ships no type information.
module = ["knowledge_storm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live gateway and SearXNG; skipped by default"]
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.3",
]
