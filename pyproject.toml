[project]
name = "kvasir"
version = "0.1.0"
description = "A self-hostable HTTP service for Stanford STORM and Co-STORM, with an Open WebUI client"
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "MIT OR Apache-2.0" }
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "knowledge-storm==1.1.1",
    "pydantic==2.13.4",
    "uvicorn==0.52.3",
]

[project.urls]
Homepage = "https://github.com/brewcoua/kvasir"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kvasir"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# knowledge_storm ships no type information.
module = ["knowledge_storm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live gateway and SearXNG; skipped by default"]
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.3",
]
