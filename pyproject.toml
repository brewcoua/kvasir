[project]
name = "kvasir-tests"
version = "0"
description = "The contract tests and the Open WebUI pipe's checks. The service itself is the Rust workspace."
# Open WebUI runs the pipe on 3.11.
requires-python = "==3.11.*"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["clients/owui"]

[tool.pytest.ini_options]
testpaths = ["tests/contract"]

[dependency-groups]
dev = [
    # What Open WebUI provides the pipe.
    "aiohttp==3.14.3",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.3",
]
