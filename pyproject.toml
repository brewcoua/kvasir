[project]
name = "kvasir"
version = "0.1.0"
description = "A self-hostable HTTP service for Stanford STORM and Co-STORM, with an Open WebUI client"
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "MIT OR Apache-2.0" }
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "uvicorn==0.52.3",
    # src/kvasir/storm is a fork of knowledge_storm, so its dependencies are declared here rather
    # than pulled in through a published package. See src/kvasir/storm/NOTICE.
    "backoff==2.2.1",
    "beautifulsoup4==4.15.0",
    "diskcache==5.6.3",
    "dspy-ai==2.4.9",
    "langchain-text-splitters==1.1.2",
    "litellm==1.80.0",
    "numpy==2.4.6",
    "openai==1.109.1",
    "pytz==2026.3.post1",
    "regex==2026.7.19",
    "requests==2.34.2",
    "scikit-learn==1.8.0",
    # 5.7.0, not what a bare resolve picks: older versions import the long-removed
    # huggingface_hub.cached_download and fail on import.
    "sentence-transformers==5.7.0",
    "toml==0.10.2",
    "tqdm==4.70.0",
    "trafilatura==2.2.0",
    "transformers==4.57.6",
    "ujson==5.13.0",
    # Not imported here. Declared only so [tool.uv.sources] can redirect it, which uv applies to
    # direct dependencies alone. See the comment on the torch source below.
    "torch==2.13.0",
]

[project.urls]
Homepage = "https://github.com/brewcoua/kvasir"

[tool.uv.sources]
# The default torch wheels bundle the CUDA runtime, several GB the service can never use: no model
# runs locally, embeddings go to the gateway. The CPU index carries the same versions without it.
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kvasir"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# The fork arrived formatted to upstream's own conventions. Reformatting it wholesale would bury
# every subsequent fix in unrelated churn, so it is excluded until the trimming pass, which is when
# what survives becomes small enough to adopt these rules deliberately.
extend-exclude = ["src/kvasir/storm"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
# The fork is untyped, so its classes are Any and strict mode refuses to subclass them. Extending
# its callback handlers is the supported way to observe a run.
disallow_subclassing_any = false
exclude = ["^src/kvasir/storm/"]

[[tool.mypy.overrides]]
# The fork is untyped, and typing 10k lines of it is not this project's work.
module = ["kvasir.storm.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live gateway and SearXNG; skipped by default"]
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.3",
]
