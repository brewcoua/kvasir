# Lists an operator can turn on. URLs only: the lists are downloaded at runtime, and none is shipped.
# `licence` is what the list's repository or SSSS's README states, "none" when it states nothing.

[[list]]
id = "dotgov"
name = "US .gov domains"
url = "https://raw.githubusercontent.com/cisagov/dotgov-data/main/current-full.csv"
group = "Official"
licence = "CC0-1.0"
effect = "kind:government"
tag = ""
enabled = true

