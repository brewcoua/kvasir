# `cargo deny check`. AGPL and GPL are left off the allow list on purpose: the service ships as an
# image, so a copyleft crate would bind the whole binary.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  # Unmaintained, not vulnerable. Only pdf_oxide uses it, in the child process that reads PDFs.
  "RUSTSEC-2026-0192",
]

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
# SQLCipher bundles SQLite (blessing) and libtomcrypt (WTFPL), both permissive. Only this crate.
exceptions = [{ crate = "sqlcipher-src", allow = ["blessing", "WTFPL"] }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
