<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kvasir runs</title>
    <!--
      Everything is inline. The image is read-only and has no outbound network, so a stylesheet or
      script from anywhere else would simply fail to load.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfbfa;
        --panel: #ffffff;
        --line: #e3e2df;
        --text: #1c1b19;
        --dim: #6d6b66;
        --accent: #3b5bdb;
        --ok: #2f9e44;
        --bad: #c92a2a;
        --busy: #e08c00;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16161a;
          --panel: #1e1e23;
          --line: #33333b;
          --text: #eceaea;
          --dim: #9a978f;
          --accent: #748ffc;
          --ok: #69db7c;
          --bad: #ff8787;
          --busy: #ffc078;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
      }
      h1 {
        font-size: 1rem;
        margin: 0;
        letter-spacing: 0.02em;
      }
      main {
        display: grid;
        grid-template-columns: minmax(16rem, 22rem) 1fr;
        gap: 1rem;
        padding: 1rem 1.25rem;
        align-items: start;
      }
      @media (max-width: 60rem) {
        main {
          grid-template-columns: 1fr;
        }
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
      }
      .panel h2 {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--dim);
        margin: 0;
        padding: 0.6rem 0.85rem;
        border-bottom: 1px solid var(--line);
      }
      .runs button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        border-bottom: 1px solid var(--line);
        padding: 0.6rem 0.85rem;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .runs button:hover {
        background: color-mix(in srgb, var(--accent) 8%, transparent);
      }
      .runs button[aria-current="true"] {
        background: color-mix(in srgb, var(--accent) 14%, transparent);
      }
      .topic {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .meta {
        color: var(--dim);
        font-size: 0.8rem;
      }
      .state {
        font-weight: 600;
      }
      .state.running {
        color: var(--busy);
      }
      .state.done {
        color: var(--ok);
      }
      .state.failed,
      .state.rejected {
        color: var(--bad);
      }
      .body {
        padding: 0.85rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        text-align: left;
        padding: 0.25rem 0.5rem 0.25rem 0;
        border-bottom: 1px solid var(--line);
      }
      th {
        color: var(--dim);
        font-weight: 500;
        font-size: 0.8rem;
      }
      td.n,
      th.n {
        text-align: right;
        padding-right: 0;
      }
      .scroll {
        overflow-x: auto;
      }
      .events {
        margin: 0;
        padding: 0;
        list-style: none;
        max-height: 22rem;
        overflow-y: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.8rem;
      }
      .events li {
        padding: 0.15rem 0;
        border-bottom: 1px solid var(--line);
      }
      /* A topic can be a whole prompt, and an event detail can be a paragraph. Keep the line
         breaks that are in the text, and let a long unbroken run of characters break anywhere
         rather than push the panel sideways. The list keeps its one-line ellipsis. */
      .heading,
      .error,
      .events li {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .stage {
        color: var(--accent);
      }
      .empty {
        color: var(--dim);
        padding: 0.85rem;
      }
      .error {
        color: var(--bad);
        margin-top: 0.5rem;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr));
        gap: 0.5rem;
        margin: 0.75rem 0;
      }
      .tile {
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0.4rem 0.6rem;
      }
      .tile .label {
        display: block;
        color: var(--dim);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .tile .value {
        font-size: 1.05rem;
        font-variant-numeric: tabular-nums;
      }
      .tile .sub {
        display: block;
        color: var(--dim);
        font-size: 0.75rem;
      }
      h3 {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--dim);
        margin: 1rem 0 0.35rem;
      }
      .steps {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .steps li {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.05rem 0.6rem;
        font-size: 0.8rem;
        color: var(--dim);
      }
      .steps li.done {
        color: var(--ok);
      }
      .steps li.current {
        color: var(--busy);
        border-color: var(--busy);
        font-weight: 600;
      }
      .now {
        margin: 0.5rem 0 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      progress {
        width: 100%;
        height: 0.4rem;
        accent-color: var(--accent);
      }
      .track {
        position: relative;
        min-width: 8rem;
        height: 0.7rem;
        background: color-mix(in srgb, var(--line) 50%, transparent);
        border-radius: 2px;
      }
      .track span {
        position: absolute;
        top: 0;
        bottom: 0;
        min-width: 2px;
        background: var(--accent);
        border-radius: 2px;
      }
      .track span.open {
        background: var(--busy);
      }
      td.track-cell {
        width: 40%;
      }
      .action {
        font: inherit;
        font-size: 0.8rem;
        color: inherit;
        background: none;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0.15rem 0.6rem;
        cursor: pointer;
      }
      .action:hover {
        background: color-mix(in srgb, var(--accent) 8%, transparent);
      }
      /* Fixed beside the page rather than over it, so the run stays readable while the result is
         open. */
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(46rem, 92vw);
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border-left: 1px solid var(--line);
        box-shadow: -8px 0 24px rgb(0 0 0 / 12%);
        z-index: 10;
      }
      .drawer[hidden] {
        display: none;
      }
      .drawer header {
        gap: 0.5rem;
      }
      .drawer header h2 {
        font-size: 0.9rem;
        margin: 0;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .drawer .content {
        flex: 1;
        overflow-y: auto;
        padding: 1rem 1.25rem;
      }
      .prose {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0.6rem 0.75rem;
        margin: 0;
        font: inherit;
      }
      .citations {
        padding-left: 1.5rem;
        font-size: 0.85rem;
      }
      .citations a {
        color: var(--accent);
        overflow-wrap: anywhere;
      }
      summary {
        cursor: pointer;
        color: var(--dim);
        margin: 0.5rem 0;
      }
      .side {
        display: grid;
        gap: 1rem;
      }
      .launch {
        display: grid;
        gap: 0.5rem;
      }
      .launch textarea,
      .launch input[type="number"],
      .launch input[type="text"] {
        width: 100%;
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0.35rem 0.5rem;
      }
      .launch textarea {
        resize: vertical;
      }
      .launch label {
        display: block;
        font-size: 0.8rem;
        color: var(--dim);
      }
      .launch .kinds label {
        display: inline;
        color: inherit;
        font-size: inherit;
        margin-right: 0.75rem;
      }
      .launch .fields {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr));
        gap: 0.5rem;
      }
      .launch .fields[hidden] {
        display: none;
      }
      .launch .question {
        margin: 0 0 0.25rem;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .markdown {
        overflow-wrap: anywhere;
      }
      .markdown h2,
      .markdown h3,
      .markdown h4 {
        text-transform: none;
        letter-spacing: normal;
        color: inherit;
        margin: 1.25rem 0 0.4rem;
      }
      .markdown h2 {
        font-size: 1.15rem;
      }
      .markdown h3 {
        font-size: 1rem;
      }
      .markdown h4 {
        font-size: 0.9rem;
      }
      .markdown a {
        color: var(--accent);
      }
      .markdown code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.85em;
      }
      .claims td {
        vertical-align: top;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>kvasir</h1>
      <span class="meta" id="summary">loading…</span>
    </header>

    <main>
      <div class="side">
        <section class="panel">
          <h2>New run</h2>
          <form class="body launch" id="launch">
            <div class="kinds">
              <label><input type="radio" name="kind" value="research" checked /> Research</label>
              <label><input type="radio" name="kind" value="article" /> Article</label>
            </div>
            <textarea id="launch-text" rows="3" required></textarea>
            <details>
              <summary>Settings</summary>
              <div class="fields" data-kind="research">
                <label>Rounds <input type="number" min="1" name="max_rounds" /></label>
                <label>Queries per round <input type="number" min="1" name="queries_per_round" /></label>
                <label>Results per query <input type="number" min="1" name="results_per_query" /></label>
              </div>
              <div class="fields" data-kind="article" hidden>
                <label>Results per search <input type="number" min="1" name="search_top_k" /></label>
                <label>Turns per perspective <input type="number" min="1" name="max_conv_turn" /></label>
                <label>Perspectives <input type="number" min="1" name="max_perspective" /></label>
                <label><input type="checkbox" name="do_polish_article" checked /> Polish</label>
              </div>
              <div class="fields">
                <label>Fast model <input type="text" name="model_fast" /></label>
                <label>Strong model <input type="text" name="model_strong" /></label>
              </div>
            </details>
            <div id="clarify"></div>
            <p>
              <button type="submit" class="action" id="launch-start">Start</button>
              <button type="button" class="action" id="launch-skip" hidden>Skip questions</button>
              <span class="meta" id="launch-status"></span>
            </p>
          </form>
        </section>

        <section class="panel">
          <h2>Runs</h2>
          <div class="runs" id="runs"><p class="empty">Nothing has run yet.</p></div>
        </section>
      </div>

      <section class="panel">
        <h2>Detail</h2>
        <div class="body" id="detail"><p class="empty">Pick a run.</p></div>
      </section>
    </main>

    <aside class="drawer" id="drawer" hidden aria-labelledby="drawer-title">
      <header>
        <h2 id="drawer-title">Result</h2>
        <button type="button" class="action" id="drawer-copy">Copy</button>
        <button type="button" class="action" id="drawer-close" aria-label="Close">Close</button>
      </header>
      <div class="content" id="drawer-content"></div>
    </aside>

    <script>
      const LIST_INTERVAL_MS = 3000;
      const CLOCK_INTERVAL_MS = 1000;

      let selected = null;
      let source = null;
      // The latest snapshot or status of the selected run, for placing events and the clock.
      let current = null;

      const el = (id) => document.getElementById(id);
      const text = (value) => document.createTextNode(String(value));
      const now = () => Date.now() / 1000;
      const count = (value) => Number(value).toLocaleString();

      function duration(total) {
        if (total < 60) return `${total.toFixed(1)}s`;
        const whole = Math.floor(total);
        const minutes = Math.floor(whole / 60);
        if (minutes < 60) return `${minutes}m ${whole % 60}s`;
        return `${Math.floor(minutes / 60)}h ${minutes % 60}m`;
      }

      function seconds(from, to) {
        if (!from) return "";
        return duration((to ?? now()) - from);
      }

      // A span that keeps counting while the run is open. The clock tick below updates it.
      function clock(from, to) {
        const span = node("span", "clock", seconds(from, to));
        if (from && to === null) span.dataset.from = from;
        return span;
      }

      function tick() {
        for (const span of document.querySelectorAll(".clock[data-from]")) {
          span.textContent = seconds(Number(span.dataset.from), null);
        }
      }

      function node(tag, className, content) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (content !== undefined) element.append(text(content));
        return element;
      }

      async function json(path) {
        const response = await fetch(path);
        if (!response.ok) throw new Error(`${path}: ${response.status}`);
        return response.json();
      }

      function progressBar(event) {
        if (!event || event.total === null || event.done === null || event.total === 0) return null;
        const bar = document.createElement("progress");
        bar.max = event.total;
        bar.value = Math.min(event.done, event.total);
        bar.title = `${event.done}/${event.total}`;
        return bar;
      }

      function drawRuns(runs) {
        const list = el("runs");
        list.replaceChildren();
        if (runs.length === 0) {
          list.append(node("p", "empty", "Nothing has run yet."));
          return;
        }
        for (const run of runs) {
          const button = document.createElement("button");
          button.type = "button";
          button.setAttribute("aria-current", String(run.id === selected));
          button.append(node("span", "topic", run.topic));

          const meta = node("span", "meta");
          meta.append(node("span", `state ${run.state}`, run.state));
          if (run.state === "running" && run.stage) meta.append(text(` · ${run.stage}`));
          meta.append(text(` · ${run.kind} · `));
          meta.append(clock(run.started_at, run.ended_at));
          const tokens = run.usage.prompt_tokens + run.usage.completion_tokens;
          if (tokens > 0) meta.append(text(` · ${count(tokens)} tok`));
          button.append(meta);

          if (run.state === "running") {
            const bar = progressBar(run.latest);
            if (bar) button.append(bar);
          }

          button.addEventListener("click", () => select(run.id));
          list.append(button);
        }
      }

      function table(headings, rows) {
        const element = document.createElement("table");
        const head = element.insertRow();
        for (const [label, numeric] of headings) {
          const cell = document.createElement("th");
          if (numeric) cell.className = "n";
          cell.append(text(label));
          head.append(cell);
        }
        for (const values of rows) {
          const row = element.insertRow();
          values.forEach((value, index) => {
            const cell = row.insertCell();
            if (headings[index][1]) cell.className = "n";
            if (value instanceof Node) {
              if (value.classList?.contains("track")) cell.className = "track-cell";
              cell.append(value);
            } else {
              cell.append(text(value));
            }
          });
        }
        const wrapper = node("div", "scroll");
        wrapper.append(element);
        return wrapper;
      }

      const USAGE_HEADINGS = [
        ["calls", true],
        ["in", true],
        ["out", true],
        ["reasoning", true],
        ["cost", true],
      ];

      function usageCells(usage) {
        return [
          count(usage.calls),
          count(usage.prompt_tokens),
          count(usage.completion_tokens),
          count(usage.reasoning_tokens),
          usage.cost.toFixed(4),
        ];
      }

      function usageTable(title, rows) {
        return table(
          [[title, false], ...USAGE_HEADINGS],
          Object.entries(rows).map(([name, usage]) => [name, ...usageCells(usage)]),
        );
      }

      function tile(label, value, sub) {
        const element = node("div", "tile");
        element.append(node("span", "label", label));
        const shown = node("span", "value");
        shown.append(value instanceof Node ? value : text(value));
        element.append(shown);
        if (sub) element.append(node("span", "sub", sub));
        return element;
      }

      function tiles(run) {
        const usage = run.usage;
        const row = node("div", "tiles");
        row.append(
          tile("elapsed", clock(run.started_at, run.ended_at)),
          tile("tokens in", count(usage.prompt_tokens)),
          tile(
            "tokens out",
            count(usage.completion_tokens),
            usage.reasoning_tokens ? `${count(usage.reasoning_tokens)} reasoning` : undefined,
          ),
          tile("cost", usage.cost.toFixed(4)),
          tile("searches", count(usage.searches)),
          tile("embedding", count(usage.embedding_tokens), "tokens"),
        );
        return row;
      }

      // Planned stages in order, then any the plan did not name, so Co-STORM shows what it saw.
      function steps(run) {
        const seen = run.stages.map((stage) => stage.name);
        const names = [...run.planned_stages, ...seen.filter((n) => !run.planned_stages.includes(n))];
        if (names.length === 0) return null;
        const list = node("ol", "steps");
        for (const name of names) {
          let state = "";
          if (name === run.stage && run.ended_at === null) state = "current";
          else if (seen.includes(name)) state = "done";
          list.append(node("li", state, name));
        }
        return list;
      }

      function timeline(run) {
        const start = run.started_at;
        const end = run.ended_at ?? now();
        const width = Math.max(end - start, 0.001);
        const byStage = run.usage.by_stage;

        const rows = run.stages.map((stage) => {
          const track = node("div", "track");
          for (const span of stage.spans) {
            const bar = node("span", span.ended_at === null ? "open" : "");
            const left = ((span.started_at - start) / width) * 100;
            const right = (((span.ended_at ?? end) - start) / width) * 100;
            bar.style.left = `${left}%`;
            bar.style.width = `${Math.max(right - left, 0)}%`;
            track.append(bar);
          }
          const usage = byStage[stage.name];
          return [
            stage.name,
            track,
            duration(stage.seconds),
            ...(usage ? usageCells(usage) : ["", "", "", "", ""]),
          ];
        });
        // Calls made before the first stage was announced.
        if (byStage.unstaged) {
          rows.push(["unstaged", node("div", "track"), "", ...usageCells(byStage.unstaged)]);
        }
        return table(
          [["stage", false], ["timeline", false], ["time", true], ...USAGE_HEADINGS],
          rows,
        );
      }

      const CALLS_SHOWN = 12;

      // Newest first, so a call in flight sits on top with its clock running.
      function callTable(run) {
        const calls = run.calls.slice(-CALLS_SHOWN).reverse();
        return table(
          [["role", false], ["model", false], ["at", true], ["time", true], ["in", true], ["out", true], ["", false]],
          calls.map((call) => [
            call.role ?? "",
            call.model,
            run.started_at ? `+${(call.started_at - run.started_at).toFixed(0)}s` : "",
            clock(call.started_at, call.ended_at),
            call.prompt_tokens === null ? "" : count(call.prompt_tokens),
            call.completion_tokens === null ? "" : count(call.completion_tokens),
            call.ended_at === null ? "running" : call.failed ? "failed" : "",
          ]),
        );
      }

      function drawLive(run) {
        current = run;
        const live = el("live");
        if (!live) return;
        live.replaceChildren();

        live.append(tiles(run));
        if (run.error) live.append(node("p", "error", run.error));

        const stepList = steps(run);
        if (stepList) live.append(stepList);
        if (run.latest && run.ended_at === null) {
          const latest = node("p", "now");
          latest.append(node("span", "stage", run.latest.stage));
          latest.append(text(` ${run.latest.detail}`));
          live.append(latest);
          const bar = progressBar(run.latest);
          if (bar) live.append(bar);
        }

        if (run.stages.length > 0) {
          live.append(node("h3", "", "Stages"));
          live.append(timeline(run));
        }
        if (run.calls.length > 0) {
          live.append(node("h3", "", "Model calls"));
          live.append(callTable(run));
        }
        if (Object.keys(run.usage.by_role).length > 0) {
          live.append(node("h3", "", "By role"));
          live.append(usageTable("role", run.usage.by_role));
        }
        if (Object.keys(run.usage.by_model).length > 0) {
          live.append(node("h3", "", "By model"));
          live.append(usageTable("model", run.usage.by_model));
        }
      }

      function citations(list) {
        const ordered = node("ol", "citations");
        for (const citation of list) {
          const item = document.createElement("li");
          item.value = citation.index;
          item.id = `cite-${citation.index}`;
          item.append(link(citation.title || citation.url, citation.url));
          if (citation.snippet) item.append(node("div", "meta", citation.snippet));
          ordered.append(item);
        }
        return ordered;
      }

      // One field holds the main text, whichever kind of run produced it.
      const resultText = (result) =>
        result.article ?? result.report ?? result.utterance ?? JSON.stringify(result, null, 2);

      // Only a web link becomes clickable: the text comes from web pages and the model.
      function link(label, url) {
        if (!/^https?:/i.test(url)) return text(label);
        const anchor = node("a", "", label);
        anchor.href = url;
        anchor.target = "_blank";
        anchor.rel = "noreferrer noopener";
        return anchor;
      }

      // Bold, italics, code, links and citation markers. Everything else stays text, and every
      // piece becomes a text node, so nothing in the markdown is ever parsed as HTML.
      const INLINE =
        /\*\*(.+?)\*\*|\*(.+?)\*|`([^`]+)`|\[([^\]]+)\]\((https?:[^)\s]+)\)|\[(\d+)\]/g;

      function inline(source) {
        const parts = [];
        let last = 0;
        for (const match of source.matchAll(INLINE)) {
          parts.push(text(source.slice(last, match.index)));
          const [, bold, italic, code, label, url, cite] = match;
          if (bold !== undefined) parts.push(node("strong", "", bold));
          else if (italic !== undefined) parts.push(node("em", "", italic));
          else if (code !== undefined) parts.push(node("code", "", code));
          else if (label !== undefined) parts.push(link(label, url));
          else {
            const anchor = node("a", "", `[${cite}]`);
            anchor.href = `#cite-${cite}`;
            parts.push(anchor);
          }
          last = match.index + match[0].length;
        }
        parts.push(text(source.slice(last)));
        return parts;
      }

      // Headings, paragraphs and lists: what the pipelines write.
      function markdown(source) {
        const root = node("div", "markdown");
        let paragraph = [];
        let list = null;
        const flush = () => {
          if (paragraph.length > 0) {
            const element = node("p");
            element.append(...inline(paragraph.join(" ")));
            root.append(element);
          }
          paragraph = [];
          list = null;
        };
        for (const line of source.split("\n")) {
          const heading = line.match(/^(#{1,6})\s+(.*)$/);
          const item = line.match(/^\s*(?:([-*])|\d+\.)\s+(.*)$/);
          if (heading) {
            flush();
            const element = node(`h${Math.min(heading[1].length + 1, 4)}`);
            element.append(...inline(heading[2]));
            root.append(element);
          } else if (item) {
            if (paragraph.length > 0) flush();
            const tag = item[1] ? "ul" : "ol";
            if (!list || list.tagName.toLowerCase() !== tag) {
              list = node(tag);
              root.append(list);
            }
            const element = node("li");
            element.append(...inline(item[2]));
            list.append(element);
          } else if (line.trim() === "") {
            flush();
          } else {
            list = null;
            paragraph.push(line.trim());
          }
        }
        flush();
        return root;
      }

      // Every claim the run gathered, so any cited sentence can be checked against its quote.
      function claimTable(claims) {
        return table(
          [["#", true], ["claim", false], ["quote", false], ["source", false], ["confidence", false]],
          claims.map((claim) => [
            claim.id,
            claim.text,
            claim.quote,
            link(claim.title || claim.url, claim.url),
            claim.confidence,
          ]),
        );
      }

      let shown = null;

      function openResult(run) {
        const result = run.result;
        shown = result;
        el("drawer-title").textContent = run.topic;
        const content = el("drawer-content");
        content.replaceChildren();
        if (result.role) content.append(node("p", "meta", result.role));
        content.append(markdown(resultText(result)));

        if (result.assumptions?.length > 0) {
          const assumed = document.createElement("details");
          assumed.append(node("summary", "", `Assumptions (${result.assumptions.length})`));
          const list = node("ul");
          for (const assumption of result.assumptions) list.append(node("li", "", assumption));
          assumed.append(list);
          content.append(assumed);
        }
        if (result.outline) {
          const outline = document.createElement("details");
          outline.append(node("summary", "", "Outline"));
          outline.append(node("pre", "prose", result.outline));
          content.append(outline);
        }
        if (result.citations?.length > 0) {
          const sources = document.createElement("details");
          sources.append(node("summary", "", `Sources (${result.citations.length})`));
          sources.append(citations(result.citations));
          // Open, so a citation marker has somewhere to jump to.
          sources.open = true;
          content.append(sources);
        }
        if (result.claims?.length > 0) {
          const evidence = document.createElement("details");
          evidence.append(node("summary", "", `Evidence (${result.claims.length} claims)`));
          const wrapper = claimTable(result.claims);
          wrapper.classList.add("claims");
          evidence.append(wrapper);
          content.append(evidence);
        }
        el("drawer").hidden = false;
        content.scrollTop = 0;
      }

      function closeResult() {
        el("drawer").hidden = true;
      }

      el("drawer-close").addEventListener("click", closeResult);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeResult();
      });
      el("drawer-copy").addEventListener("click", async () => {
        const copy = el("drawer-copy");
        await navigator.clipboard.writeText(resultText(shown));
        copy.textContent = "Copied";
        setTimeout(() => (copy.textContent = "Copy"), 1500);
      });

      function drawDetail(run) {
        const panel = el("detail");
        panel.replaceChildren();

        const heading = node("p", "heading");
        heading.append(node("span", `state ${run.state}`, run.state));
        heading.append(text(` · ${run.kind} · ${run.topic}`));
        panel.append(heading);

        const live = node("div");
        live.id = "live";
        panel.append(live);
        drawLive(run);

        if (run.result) {
          const open = node("button", "action", "View result");
          open.type = "button";
          open.addEventListener("click", () => openResult(run));
          const row = node("p");
          row.append(open);
          panel.append(row);
        }

        panel.append(node("h3", "", "Events"));
        const events = node("ul", "events");
        events.id = "events";
        for (const event of run.events) events.append(eventItem(event));
        panel.append(events);
        events.scrollTop = events.scrollHeight;
      }

      function eventItem(event) {
        const item = document.createElement("li");
        if (current?.started_at) {
          item.append(node("span", "meta", `+${(event.at - current.started_at).toFixed(1)}s `));
        }
        item.append(node("span", "stage", event.stage));
        item.append(text(` ${event.detail}`));
        return item;
      }

      function follow(runId) {
        source = new EventSource(`/v1/runs/${runId}/events`);

        source.addEventListener("snapshot", (message) => {
          const run = JSON.parse(message.data);
          if (run.id !== selected) return;
          current = run;
          drawDetail(run);
          // The server closes the stream once the run is over. EventSource would reconnect for
          // ever otherwise, since it treats any close as a connection to retry.
          if (run.ended_at !== null) source.close();
        });

        // Usage and stage timings, after each event and at intervals while nothing happens.
        source.addEventListener("status", (message) => {
          const run = JSON.parse(message.data);
          if (run.id === selected) drawLive(run);
        });

        source.addEventListener("progress", (message) => {
          const list = el("events");
          if (!list) return;
          list.append(eventItem(JSON.parse(message.data)));
          list.scrollTop = list.scrollHeight;
        });
      }

      async function select(runId) {
        if (source) source.close();
        selected = runId;
        current = null;
        closeResult();
        const run = await json(`/v1/runs/${runId}`);
        current = run;
        drawDetail(run);
        follow(runId);
        refresh();
      }

      async function refresh() {
        try {
          const runs = await json("/v1/runs");
          drawRuns(runs);
          const active = runs.filter((run) => run.state === "running").length;
          el("summary").textContent = `${runs.length} run(s), ${active} in flight`;
        } catch (error) {
          el("summary").textContent = String(error);
        }
      }

      const form = el("launch");
      const PLACEHOLDERS = {
        research: "A question, such as: which European battery makers are best placed for 2030?",
        article: "A topic, such as: the history of the Kvasir stone",
      };
      // The questions `/v1/research/clarify` asked, while the user answers them. Null otherwise.
      let asked = null;

      const kind = () => form.elements.kind.value;
      const status = (message) => (el("launch-status").textContent = message);

      function resetClarify() {
        asked = null;
        el("clarify").replaceChildren();
        el("launch-skip").hidden = true;
      }

      function showKind() {
        for (const fields of form.querySelectorAll("[data-kind]")) {
          fields.hidden = fields.dataset.kind !== kind();
        }
        el("launch-text").placeholder = PLACEHOLDERS[kind()];
        resetClarify();
      }

      function body(clarifications) {
        const request = {};
        const text = el("launch-text").value.trim();
        if (kind() === "research") {
          request.question = text;
          request.clarifications = clarifications;
        } else {
          request.topic = text;
          request.do_polish_article = form.elements.do_polish_article.checked;
        }
        // Only the settings shown for this kind, and only those filled in: the rest default.
        const fields = form.querySelectorAll(
          `[data-kind="${kind()}"] input:not([type=checkbox]), [name^=model_]`,
        );
        for (const input of fields) {
          if (input.value.trim() === "") continue;
          request[input.name] = input.type === "number" ? Number(input.value) : input.value.trim();
        }
        return request;
      }

      function showQuestions(questions) {
        asked = questions;
        const box = el("clarify");
        box.replaceChildren(node("p", "meta", "Answer what you can, or skip."));
        questions.forEach((question, index) => {
          box.append(node("p", "question", question));
          const answer = document.createElement("textarea");
          answer.rows = 1;
          answer.name = `answer-${index}`;
          box.append(answer);
        });
        el("launch-skip").hidden = false;
        status("");
      }

      function answers() {
        return asked
          .map((question, index) => ({
            question,
            answer: form.elements[`answer-${index}`].value.trim(),
          }))
          .filter((clarification) => clarification.answer !== "");
      }

      // Posts the run and reads only far enough to learn its id, then follows it like any other
      // run. The rest of the stream is still read, and thrown away: the server gives the run slot
      // back when this response ends, so ending it early would free the slot mid-run.
      async function start(clarifications) {
        const button = el("launch-start");
        button.disabled = true;
        status("starting…");
        try {
          const response = await fetch(kind() === "research" ? "/v1/research" : "/v1/article", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(body(clarifications)),
          });
          if (!response.ok) {
            const error = await response.json().catch(() => ({}));
            const message = error.message ?? JSON.stringify(error.detail ?? response.status);
            status(`refused: ${message}`);
            return;
          }
          const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
          let buffer = "";
          let runId = null;
          while (runId === null) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += value;
            const frame = buffer.match(/event: run\ndata: (.*)\n\n/);
            if (frame) runId = JSON.parse(frame[1]).run_id;
          }
          if (runId === null) {
            status("the run ended before it started");
            return;
          }
          (async () => {
            while (!(await reader.read()).done);
          })().catch(() => {});
          resetClarify();
          el("launch-text").value = "";
          status("");
          select(runId);
        } catch (error) {
          status(String(error));
        } finally {
          button.disabled = false;
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (kind() !== "research") return start([]);
        if (asked !== null) return start(answers());

        status("checking whether the question needs clarifying…");
        el("launch-start").disabled = true;
        try {
          const response = await fetch("/v1/research/clarify", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ question: el("launch-text").value.trim() }),
          });
          if (!response.ok) throw new Error(`clarify: ${response.status}`);
          const { questions } = await response.json();
          if (questions.length > 0) return showQuestions(questions);
        } catch (error) {
          // Clarifying is a courtesy. Failing to, the run starts as asked.
          console.warn(error);
        } finally {
          el("launch-start").disabled = false;
        }
        return start([]);
      });
      el("launch-skip").addEventListener("click", () => start([]));
      el("launch-text").addEventListener("input", resetClarify);
      for (const radio of form.elements.kind) radio.addEventListener("change", showKind);
      showKind();

      refresh();
      setInterval(refresh, LIST_INTERVAL_MS);
      setInterval(tick, CLOCK_INTERVAL_MS);
    </script>
  </body>
</html>
