<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kvasir runs</title>
    <!--
      Everything is inline. The image is read-only and has no outbound network, so a stylesheet or
      script from anywhere else would simply fail to load.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfbfa;
        --panel: #ffffff;
        --line: #e3e2df;
        --text: #1c1b19;
        --dim: #6d6b66;
        --accent: #3b5bdb;
        --ok: #2f9e44;
        --bad: #c92a2a;
        --busy: #e08c00;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16161a;
          --panel: #1e1e23;
          --line: #33333b;
          --text: #eceaea;
          --dim: #9a978f;
          --accent: #748ffc;
          --ok: #69db7c;
          --bad: #ff8787;
          --busy: #ffc078;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
      }
      h1 {
        font-size: 1rem;
        margin: 0;
        letter-spacing: 0.02em;
      }
      main {
        display: grid;
        grid-template-columns: minmax(16rem, 22rem) 1fr;
        gap: 1rem;
        padding: 1rem 1.25rem;
        align-items: start;
      }
      @media (max-width: 60rem) {
        main {
          grid-template-columns: 1fr;
        }
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
      }
      .panel h2 {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--dim);
        margin: 0;
        padding: 0.6rem 0.85rem;
        border-bottom: 1px solid var(--line);
      }
      .runs button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        border-bottom: 1px solid var(--line);
        padding: 0.6rem 0.85rem;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .runs button:hover {
        background: color-mix(in srgb, var(--accent) 8%, transparent);
      }
      .runs button[aria-current="true"] {
        background: color-mix(in srgb, var(--accent) 14%, transparent);
      }
      .topic {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .meta {
        color: var(--dim);
        font-size: 0.8rem;
      }
      .state {
        font-weight: 600;
      }
      .state.running {
        color: var(--busy);
      }
      .state.done {
        color: var(--ok);
      }
      .state.failed,
      .state.rejected {
        color: var(--bad);
      }
      .body {
        padding: 0.85rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        text-align: left;
        padding: 0.25rem 0.5rem 0.25rem 0;
        border-bottom: 1px solid var(--line);
      }
      th {
        color: var(--dim);
        font-weight: 500;
        font-size: 0.8rem;
      }
      td.n,
      th.n {
        text-align: right;
        padding-right: 0;
      }
      .scroll {
        overflow-x: auto;
      }
      .events {
        margin: 0;
        padding: 0;
        list-style: none;
        max-height: 22rem;
        overflow-y: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.8rem;
      }
      .events li {
        padding: 0.15rem 0;
        border-bottom: 1px solid var(--line);
      }
      /* A topic can be a whole prompt, and an event detail can be a paragraph. Keep the line
         breaks that are in the text, and let a long unbroken run of characters break anywhere
         rather than push the panel sideways. The list keeps its one-line ellipsis. */
      .heading,
      .error,
      .events li {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .stage {
        color: var(--accent);
      }
      .empty {
        color: var(--dim);
        padding: 0.85rem;
      }
      .error {
        color: var(--bad);
        margin-top: 0.5rem;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr));
        gap: 0.5rem;
        margin: 0.75rem 0;
      }
      .tile {
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0.4rem 0.6rem;
      }
      .tile .label {
        display: block;
        color: var(--dim);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .tile .value {
        font-size: 1.05rem;
        font-variant-numeric: tabular-nums;
      }
      .tile .sub {
        display: block;
        color: var(--dim);
        font-size: 0.75rem;
      }
      h3 {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--dim);
        margin: 1rem 0 0.35rem;
      }
      .steps {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .steps li {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.05rem 0.6rem;
        font-size: 0.8rem;
        color: var(--dim);
      }
      .steps li.done {
        color: var(--ok);
      }
      .steps li.current {
        color: var(--busy);
        border-color: var(--busy);
        font-weight: 600;
      }
      .now {
        margin: 0.5rem 0 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      progress {
        width: 100%;
        height: 0.4rem;
        accent-color: var(--accent);
      }
      .track {
        position: relative;
        min-width: 8rem;
        height: 0.7rem;
        background: color-mix(in srgb, var(--line) 50%, transparent);
        border-radius: 2px;
      }
      .track span {
        position: absolute;
        top: 0;
        bottom: 0;
        min-width: 2px;
        background: var(--accent);
        border-radius: 2px;
      }
      .track span.open {
        background: var(--busy);
      }
      td.track-cell {
        width: 40%;
      }
      .action {
        font: inherit;
        font-size: 0.8rem;
        color: inherit;
        background: none;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0.15rem 0.6rem;
        cursor: pointer;
      }
      .action:hover {
        background: color-mix(in srgb, var(--accent) 8%, transparent);
      }
      /* Fixed beside the page rather than over it, so the run stays readable while the result is
         open. */
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(46rem, 92vw);
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border-left: 1px solid var(--line);
        box-shadow: -8px 0 24px rgb(0 0 0 / 12%);
        z-index: 10;
      }
      .drawer[hidden] {
        display: none;
      }
      .drawer header {
        gap: 0.5rem;
      }
      .drawer header h2 {
        font-size: 0.9rem;
        margin: 0;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .drawer .content {
        flex: 1;
        overflow-y: auto;
        padding: 1rem 1.25rem;
      }
      .prose {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0.6rem 0.75rem;
        margin: 0;
        font: inherit;
      }
      .citations {
        padding-left: 1.5rem;
        font-size: 0.85rem;
      }
      .citations a {
        color: var(--accent);
        overflow-wrap: anywhere;
      }
      summary {
        cursor: pointer;
        color: var(--dim);
        margin: 0.5rem 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>kvasir</h1>
      <span class="meta" id="summary">loading…</span>
    </header>

    <main>
      <section class="panel">
        <h2>Runs</h2>
        <div class="runs" id="runs"><p class="empty">Nothing has run yet.</p></div>
      </section>

      <section class="panel">
        <h2>Detail</h2>
        <div class="body" id="detail"><p class="empty">Pick a run.</p></div>
      </section>
    </main>

    <aside class="drawer" id="drawer" hidden aria-labelledby="drawer-title">
      <header>
        <h2 id="drawer-title">Result</h2>
        <button type="button" class="action" id="drawer-copy">Copy</button>
        <button type="button" class="action" id="drawer-close" aria-label="Close">Close</button>
      </header>
      <div class="content" id="drawer-content"></div>
    </aside>

    <script>
      const LIST_INTERVAL_MS = 3000;
      const CLOCK_INTERVAL_MS = 1000;

      let selected = null;
      let source = null;
      // The latest snapshot or status of the selected run, for placing events and the clock.
      let current = null;

      const el = (id) => document.getElementById(id);
      const text = (value) => document.createTextNode(String(value));
      const now = () => Date.now() / 1000;
      const count = (value) => Number(value).toLocaleString();

      function duration(total) {
        if (total < 60) return `${total.toFixed(1)}s`;
        const whole = Math.floor(total);
        const minutes = Math.floor(whole / 60);
        if (minutes < 60) return `${minutes}m ${whole % 60}s`;
        return `${Math.floor(minutes / 60)}h ${minutes % 60}m`;
      }

      function seconds(from, to) {
        if (!from) return "";
        return duration((to ?? now()) - from);
      }

      // A span that keeps counting while the run is open. The clock tick below updates it.
      function clock(from, to) {
        const span = node("span", "clock", seconds(from, to));
        if (from && to === null) span.dataset.from = from;
        return span;
      }

      function tick() {
        for (const span of document.querySelectorAll(".clock[data-from]")) {
          span.textContent = seconds(Number(span.dataset.from), null);
        }
      }

      function node(tag, className, content) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (content !== undefined) element.append(text(content));
        return element;
      }

      async function json(path) {
        const response = await fetch(path);
        if (!response.ok) throw new Error(`${path}: ${response.status}`);
        return response.json();
      }

      function progressBar(event) {
        if (!event || event.total === null || event.done === null || event.total === 0) return null;
        const bar = document.createElement("progress");
        bar.max = event.total;
        bar.value = Math.min(event.done, event.total);
        bar.title = `${event.done}/${event.total}`;
        return bar;
      }

      function drawRuns(runs) {
        const list = el("runs");
        list.replaceChildren();
        if (runs.length === 0) {
          list.append(node("p", "empty", "Nothing has run yet."));
          return;
        }
        for (const run of runs) {
          const button = document.createElement("button");
          button.type = "button";
          button.setAttribute("aria-current", String(run.id === selected));
          button.append(node("span", "topic", run.topic));

          const meta = node("span", "meta");
          meta.append(node("span", `state ${run.state}`, run.state));
          if (run.state === "running" && run.stage) meta.append(text(` · ${run.stage}`));
          meta.append(text(` · ${run.kind} · `));
          meta.append(clock(run.started_at, run.ended_at));
          const tokens = run.usage.prompt_tokens + run.usage.completion_tokens;
          if (tokens > 0) meta.append(text(` · ${count(tokens)} tok`));
          button.append(meta);

          if (run.state === "running") {
            const bar = progressBar(run.latest);
            if (bar) button.append(bar);
          }

          button.addEventListener("click", () => select(run.id));
          list.append(button);
        }
      }

      function table(headings, rows) {
        const element = document.createElement("table");
        const head = element.insertRow();
        for (const [label, numeric] of headings) {
          const cell = document.createElement("th");
          if (numeric) cell.className = "n";
          cell.append(text(label));
          head.append(cell);
        }
        for (const values of rows) {
          const row = element.insertRow();
          values.forEach((value, index) => {
            const cell = row.insertCell();
            if (headings[index][1]) cell.className = "n";
            if (value instanceof Node) {
              if (value.classList.contains("track")) cell.className = "track-cell";
              cell.append(value);
            } else {
              cell.append(text(value));
            }
          });
        }
        const wrapper = node("div", "scroll");
        wrapper.append(element);
        return wrapper;
      }

      const USAGE_HEADINGS = [
        ["calls", true],
        ["in", true],
        ["out", true],
        ["reasoning", true],
        ["cost", true],
      ];

      function usageCells(usage) {
        return [
          count(usage.calls),
          count(usage.prompt_tokens),
          count(usage.completion_tokens),
          count(usage.reasoning_tokens),
          usage.cost.toFixed(4),
        ];
      }

      function usageTable(title, rows) {
        return table(
          [[title, false], ...USAGE_HEADINGS],
          Object.entries(rows).map(([name, usage]) => [name, ...usageCells(usage)]),
        );
      }

      function tile(label, value, sub) {
        const element = node("div", "tile");
        element.append(node("span", "label", label));
        const shown = node("span", "value");
        shown.append(value instanceof Node ? value : text(value));
        element.append(shown);
        if (sub) element.append(node("span", "sub", sub));
        return element;
      }

      function tiles(run) {
        const usage = run.usage;
        const row = node("div", "tiles");
        row.append(
          tile("elapsed", clock(run.started_at, run.ended_at)),
          tile("tokens in", count(usage.prompt_tokens)),
          tile(
            "tokens out",
            count(usage.completion_tokens),
            usage.reasoning_tokens ? `${count(usage.reasoning_tokens)} reasoning` : undefined,
          ),
          tile("cost", usage.cost.toFixed(4)),
          tile("searches", count(usage.searches)),
          tile("embedding", count(usage.embedding_tokens), "tokens"),
        );
        return row;
      }

      // Planned stages in order, then any the plan did not name, so Co-STORM shows what it saw.
      function steps(run) {
        const seen = run.stages.map((stage) => stage.name);
        const names = [...run.planned_stages, ...seen.filter((n) => !run.planned_stages.includes(n))];
        if (names.length === 0) return null;
        const list = node("ol", "steps");
        for (const name of names) {
          let state = "";
          if (name === run.stage && run.ended_at === null) state = "current";
          else if (seen.includes(name)) state = "done";
          list.append(node("li", state, name));
        }
        return list;
      }

      function timeline(run) {
        const start = run.started_at;
        const end = run.ended_at ?? now();
        const width = Math.max(end - start, 0.001);
        const byStage = run.usage.by_stage;

        const rows = run.stages.map((stage) => {
          const track = node("div", "track");
          for (const span of stage.spans) {
            const bar = node("span", span.ended_at === null ? "open" : "");
            const left = ((span.started_at - start) / width) * 100;
            const right = (((span.ended_at ?? end) - start) / width) * 100;
            bar.style.left = `${left}%`;
            bar.style.width = `${Math.max(right - left, 0)}%`;
            track.append(bar);
          }
          const usage = byStage[stage.name];
          return [
            stage.name,
            track,
            duration(stage.seconds),
            ...(usage ? usageCells(usage) : ["", "", "", "", ""]),
          ];
        });
        // Calls made before the first stage was announced.
        if (byStage.unstaged) {
          rows.push(["unstaged", node("div", "track"), "", ...usageCells(byStage.unstaged)]);
        }
        return table(
          [["stage", false], ["timeline", false], ["time", true], ...USAGE_HEADINGS],
          rows,
        );
      }

      function drawLive(run) {
        current = run;
        const live = el("live");
        if (!live) return;
        live.replaceChildren();

        live.append(tiles(run));
        if (run.error) live.append(node("p", "error", run.error));

        const stepList = steps(run);
        if (stepList) live.append(stepList);
        if (run.latest && run.ended_at === null) {
          const latest = node("p", "now");
          latest.append(node("span", "stage", run.latest.stage));
          latest.append(text(` ${run.latest.detail}`));
          live.append(latest);
          const bar = progressBar(run.latest);
          if (bar) live.append(bar);
        }

        if (run.stages.length > 0) {
          live.append(node("h3", "", "Stages"));
          live.append(timeline(run));
        }
        if (Object.keys(run.usage.by_role).length > 0) {
          live.append(node("h3", "", "By role"));
          live.append(usageTable("role", run.usage.by_role));
        }
        if (Object.keys(run.usage.by_model).length > 0) {
          live.append(node("h3", "", "By model"));
          live.append(usageTable("model", run.usage.by_model));
        }
      }

      function citations(list) {
        const ordered = node("ol", "citations");
        for (const citation of list) {
          const item = document.createElement("li");
          item.value = citation.index;
          // Search results are untrusted: only a web link becomes clickable.
          if (/^https?:/i.test(citation.url)) {
            const link = node("a", "", citation.title || citation.url);
            link.href = citation.url;
            link.target = "_blank";
            link.rel = "noreferrer noopener";
            item.append(link);
          } else {
            item.append(text(citation.title || citation.url));
          }
          if (citation.snippet) item.append(node("div", "meta", citation.snippet));
          ordered.append(item);
        }
        return ordered;
      }

      // One field holds the main text, whichever kind of run produced it.
      const resultText = (result) =>
        result.article ?? result.report ?? result.utterance ?? JSON.stringify(result, null, 2);

      function openResult(run) {
        const result = run.result;
        el("drawer-title").textContent = run.topic;
        const content = el("drawer-content");
        content.replaceChildren();
        if (result.role) content.append(node("p", "meta", result.role));
        content.append(node("pre", "prose", resultText(result)));

        if (result.outline) {
          const outline = document.createElement("details");
          outline.append(node("summary", "", "Outline"));
          outline.append(node("pre", "prose", result.outline));
          content.append(outline);
        }
        if (result.citations?.length > 0) {
          const sources = document.createElement("details");
          sources.append(node("summary", "", `Sources (${result.citations.length})`));
          sources.append(citations(result.citations));
          content.append(sources);
        }
        el("drawer").hidden = false;
        content.scrollTop = 0;
      }

      function closeResult() {
        el("drawer").hidden = true;
      }

      el("drawer-close").addEventListener("click", closeResult);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeResult();
      });
      el("drawer-copy").addEventListener("click", async () => {
        const copy = el("drawer-copy");
        await navigator.clipboard.writeText(el("drawer-content").querySelector(".prose").textContent);
        copy.textContent = "Copied";
        setTimeout(() => (copy.textContent = "Copy"), 1500);
      });

      function drawDetail(run) {
        const panel = el("detail");
        panel.replaceChildren();

        const heading = node("p", "heading");
        heading.append(node("span", `state ${run.state}`, run.state));
        heading.append(text(` · ${run.kind} · ${run.topic}`));
        panel.append(heading);

        const live = node("div");
        live.id = "live";
        panel.append(live);
        drawLive(run);

        if (run.result) {
          const open = node("button", "action", "View result");
          open.type = "button";
          open.addEventListener("click", () => openResult(run));
          const row = node("p");
          row.append(open);
          panel.append(row);
        }

        panel.append(node("h3", "", "Events"));
        const events = node("ul", "events");
        events.id = "events";
        for (const event of run.events) events.append(eventItem(event));
        panel.append(events);
        events.scrollTop = events.scrollHeight;
      }

      function eventItem(event) {
        const item = document.createElement("li");
        if (current?.started_at) {
          item.append(node("span", "meta", `+${(event.at - current.started_at).toFixed(1)}s `));
        }
        item.append(node("span", "stage", event.stage));
        item.append(text(` ${event.detail}`));
        return item;
      }

      function follow(runId) {
        source = new EventSource(`/v1/runs/${runId}/events`);

        source.addEventListener("snapshot", (message) => {
          const run = JSON.parse(message.data);
          if (run.id !== selected) return;
          current = run;
          drawDetail(run);
          // The server closes the stream once the run is over. EventSource would reconnect for
          // ever otherwise, since it treats any close as a connection to retry.
          if (run.ended_at !== null) source.close();
        });

        // Usage and stage timings, after each event and at intervals while nothing happens.
        source.addEventListener("status", (message) => {
          const run = JSON.parse(message.data);
          if (run.id === selected) drawLive(run);
        });

        source.addEventListener("progress", (message) => {
          const list = el("events");
          if (!list) return;
          list.append(eventItem(JSON.parse(message.data)));
          list.scrollTop = list.scrollHeight;
        });
      }

      async function select(runId) {
        if (source) source.close();
        selected = runId;
        current = null;
        closeResult();
        const run = await json(`/v1/runs/${runId}`);
        current = run;
        drawDetail(run);
        follow(runId);
        refresh();
      }

      async function refresh() {
        try {
          const runs = await json("/v1/runs");
          drawRuns(runs);
          const active = runs.filter((run) => run.state === "running").length;
          el("summary").textContent = `${runs.length} run(s), ${active} in flight`;
        } catch (error) {
          el("summary").textContent = String(error);
        }
      }

      refresh();
      setInterval(refresh, LIST_INTERVAL_MS);
      setInterval(tick, CLOCK_INTERVAL_MS);
    </script>
  </body>
</html>
